name: Publish YVGSPCAM APK Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify YVGSPCAM.apk in releases/
        run: |
          ls -lh releases/YVGSPCAM.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YVGSPCAM-apk
          path: releases/YVGSPCAM.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: "YVGSPCAM Android APK (v1.0)"
          body: "Download **`YVGSPCAM.apk`** below to install and test YVGSPCAM (GPS Map Camera) on your Android phone."
          files: releases/YVGSPCAM.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
